<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled horror game</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      /* The game renders at low resolution and is stretched up with hard pixels. */
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: pointer; }
      /* The "click to play" message. Clicks pass through it to the game. */
      #overlay {
        position: fixed; left: 0; right: 0; bottom: 12%; text-align: center;
        font: 16px/1.8 "Courier New", monospace; letter-spacing: 0.15em;
        color: #c8c4b8; text-shadow: 0 0 6px #000; pointer-events: none;
      }
      #overlay small { font-size: 12px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="overlay">
      CLICK TO PLAY<br />
      <small>WASD walk &middot; mouse look &middot; Shift faster &middot; Esc release mouse</small>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
